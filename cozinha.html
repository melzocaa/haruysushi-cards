<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Pedidos - Haruy Sushi</title>
    <link rel="icon" type="image/x-icon" href="assets/images/logopwa.png" />
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonte Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        barlow: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        primary: '#ca3c3f',
                        dark: '#222222',
                        muted: '#999999',
                        footer: '#333333',
                    }
                }
            }
        }
    </script>

</head>
<body class="font-barlow text-dark w-full m-0 min-h-screen flex flex-col overflow-x-hidden bg-gray-50">

    <!-- HEADER -->
    <header
        class="bg-white shadow-md py-4 px-4 md:px-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 sticky top-0 z-50">
        <div class="flex items-center gap-3 w-full md:w-auto">
            <img
                src="assets/images/logo.png"
                onerror="this.src='assets/images/logopwa.png'; this.onerror=null;"
                alt="Haruy Sushi"
                class="h-10 md:h-12 w-auto">
            <h1 class="text-lg md:text-2xl font-bold text-primary border-l-2 border-primary pl-3 md:pl-4">
                Painel da Cozinha
            </h1>
        </div>

        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3 w-full md:w-auto">
            <div id="status-conexao" class="flex items-center gap-2 text-sm font-bold text-green-600">
                <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                Online
            </div>

            <button onclick="carregarPedidos()" class="bg-dark text-white px-4 py-3 rounded-[15px] font-bold hover:bg-black transition w-full sm:w-auto">
                Atualizar
            </button>
        </div>
    </header>

    <!-- MAIN -->
    <main class="flex-grow p-4 md:p-6">
        <div class="max-w-7xl mx-auto">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-6">
                <h2 class="text-2xl md:text-3xl font-black text-dark">
                    Pedidos Recebidos
                </h2>
                <span id="contador-pedidos" class="bg-primary text-white px-3 py-1 rounded-full font-bold text-sm w-fit">
                    0 pedidos
                </span>
            </div>

            <!-- GRID -->
            <div id="pedidos-container" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 md:gap-6">
                <p class="text-muted col-span-full text-center py-10">
                    Carregando pedidos...
                </p>
            </div>
        </div>
    </main>

    <!-- SCRIPT -->
    <script>
        // =========================================
        // URL BACKEND
        // =========================================
        const URL_API = 'https://aula07-backend-vercel.vercel.app/api/pedidos';

        // =========================================
        // CARREGAR PEDIDOS
        // =========================================
        async function carregarPedidos() {
            const container = document.getElementById('pedidos-container');
            const contador = document.getElementById('contador-pedidos');
            const statusConexao = document.getElementById('status-conexao');
            try {
                statusConexao.innerHTML = `
                    <span class="w-3 h-3 bg-yellow-500 rounded-full animate-pulse"></span>
                    Atualizando...
                `;
                statusConexao.className =
                    'flex items-center gap-2 text-sm font-bold text-yellow-600';
                const resposta = await fetch(URL_API);
                if (!resposta.ok) {
                    throw new Error('Erro ao buscar pedidos');
                }

                // =========================
                // RESPOSTA
                // =========================
                const dados = await resposta.json();
                console.log('DADOS API:', dados);

                // Corrige qualquer formato da API
                let pedidos = [];
                if (Array.isArray(dados)) {
                    pedidos = dados;
                } else if (Array.isArray(dados.pedidos)) {
                    pedidos = dados.pedidos;
                } else {
                    pedidos = [];
                }
                console.log('PEDIDOS:', pedidos);

                // =========================
                // CONTADOR
                // =========================
                contador.innerText =
                    `${pedidos.length} pedido(s)`;

                // =========================
                // RENDERIZAR
                // =========================
                renderizarPedidos(pedidos);
                statusConexao.innerHTML = `
                    <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                    Online
                `;
                statusConexao.className =
                    'flex items-center gap-2 text-sm font-bold text-green-600';
            } catch (erro) {
                console.error('ERRO:', erro);
                container.innerHTML = `
                    <div class="col-span-full bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl">
                        Não foi possível carregar os pedidos.
                    </div>
                `;
                statusConexao.innerHTML = `
                    <span class="w-3 h-3 bg-red-500 rounded-full"></span>
                    Offline
                `;
                statusConexao.className =
                    'flex items-center gap-2 text-sm font-bold text-red-600';
            }
        }

        // =========================================
        // RENDERIZAR PEDIDOS
        // =========================================
        function renderizarPedidos(pedidos) {
            const container = document.getElementById('pedidos-container');
            container.innerHTML = '';

            // =========================================
            // SEM PEDIDOS
            // =========================================
            if (!pedidos || pedidos.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-16 opacity-50">
                        <svg
                            class="w-16 h-16 text-muted mb-4"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2">
                            </path>
                        </svg>
                        <p class="text-xl font-bold text-dark">
                            Nenhum pedido pendente.
                        </p>
                        <p class="text-muted">
                            A cozinha está livre por enquanto!
                        </p>
                    </div>
                `;
                return;
            }

            // =========================================
            // LOOP PEDIDOS
            // =========================================
            pedidos.forEach((pedido) => {
                // =========================
                // ITENS
                // =========================
                let itens = [];
                try {
                    if (typeof pedido.itens === 'string') {
                        itens = JSON.parse(pedido.itens);
                    } else if (Array.isArray(pedido.itens)) {
                        itens = pedido.itens;
                    } else {
                        itens = [];
                    }
                } catch (erro) {
                    console.log('Erro itens:', erro);
                    itens = [];
                }

                // Segurança extra
                if (!Array.isArray(itens)) {
                    itens = [];
                }

                // =========================
                // HTML ITENS
                // =========================
                let htmlItens = '';
                itens.forEach((item) => {
                    htmlItens += `
                        <li class="flex justify-between gap-2 border-b border-gray-100 py-2 text-sm">
                            <span class="font-semibold text-dark break-words">
                                ${item.quantidade || 1}x ${item.nome || 'Produto'}
                            </span>
                            <span class="text-muted whitespace-nowrap">
                                R$ ${Number(item.preco || 0).toFixed(2)}
                            </span>
                        </li>
                    `;
                });

                // =========================
                // DATA
                // =========================
                let dataFormatada = 'Data desconhecida';
                if (pedido.created_at) {
                    const dataObj =
                        new Date(pedido.created_at);
                    dataFormatada =
                        dataObj.toLocaleTimeString('pt-BR', {
                            hour: '2-digit',
                            minute: '2-digit'
                        })
                        + ' - ' +
                        dataObj.toLocaleDateString('pt-BR');
                }

                // =========================
                // CARD
                // =========================
                container.innerHTML += `
                    <div class="bg-white border-t-4 border-primary shadow-lg rounded-xl p-4 md:p-5 flex flex-col hover:shadow-xl transition duration-300 w-full overflow-hidden">
                        <div class="flex flex-col sm:flex-row justify-between sm:items-start gap-2 mb-4">
                            <div>
                                <h2 class="text-lg md:text-xl font-black text-dark">
                                    Pedido #${pedido.id || '---'}
                                </h2>
                                <span class="text-xs text-muted">
                                    ${dataFormatada}
                                </span>
                            </div>

                            <span class="bg-yellow-100 text-yellow-800 text-xs font-black uppercase px-2 py-1 rounded w-fit">
                                ${pedido.status || 'Pendente'}
                            </span>
                        </div>

                        <div class="mb-4 bg-gray-50 p-3 rounded-lg text-sm">
                            <p class="mb-1 break-words">
                                <strong>Cliente:</strong>
                                <span class="text-gray-700">
                                    ${pedido.cliente_nome || 'Não informado'}
                                </span>
                            </p>
                            <p class="break-words">
                                <strong>Endereço:</strong>
                                <span class="text-gray-700">
                                    ${pedido.cliente_endereco || 'Não informado'}
                                </span>
                            </p>
                        </div>
                        <div class="flex-grow mb-4">
                            <h3 class="font-bold text-dark mb-2 uppercase text-sm">
                                Itens do Pedido:
                            </h3>
                            <ul class="text-sm">
                                ${htmlItens || '<li>Nenhum item</li>'}
                            </ul>
                        </div>
                        <div class="mt-auto pt-4 border-t border-gray-200 flex flex-col sm:flex-row justify-between sm:items-center gap-3">
                            <div class="flex flex-col">
                                <span class="text-xs text-muted font-bold uppercase">
                                    Total a pagar
                                </span>
                                <span class="font-black text-xl text-primary">
                                    R$ ${Number(pedido.total || 0).toFixed(2)}
                                </span>
                            </div>

                            <button
                                onclick="concluirPedido(this)"
                                class="bg-green-600 text-white px-5 py-3 rounded-[15px] font-bold hover:bg-green-700 transition transform hover:scale-105 w-full sm:w-auto">
                                Pronto ✓
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // =========================================
        // FINALIZAR
        // =========================================
        function concluirPedido(btn) {
            const card =
                btn.closest('.bg-white');
            if (!card) return;
            card.classList.add(
                'opacity-50',
                'grayscale',
                'pointer-events-none'
            );
            btn.innerText = 'Finalizado';
            btn.classList.replace(
                'bg-green-600',
                'bg-gray-400'
            );
            btn.classList.remove(
                'hover:bg-green-700'
            );
        }

        // =========================================
        // INICIAR
        // =========================================
        carregarPedidos();
        setInterval(carregarPedidos, 10000);
    </script>
    </body>
    </html>
